<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="emeraldGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#22533F"/>
      <stop offset="50%" stop-color="#132E22"/>
      <stop offset="100%" stop-color="#081711"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6"/>
      <stop offset="30%" stop-color="#E5CD8B"/>
      <stop offset="70%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8C6826"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#05120B" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Ambient Outer Glow Ring -->
  <circle cx="64" cy="64" r="61" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.45"/>
  
  <!-- Dashed Royal Ring -->
  <circle cx="64" cy="64" r="57" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3.5, 3" opacity="0.8"/>

  <!-- Main Medallion Body -->
  <circle cx="64" cy="64" r="51" fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="2.4" filter="url(#shadow)"/>

  <!-- Inner Delicate Accent Ring -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" opacity="0.6"/>

  <!-- Cardinal Accents (Floral Diamond Beads) -->
  <polygon points="64,18 66,20 64,22 62,20" fill="url(#goldGrad)"/>
  <polygon points="64,106 66,108 64,110 62,108" fill="url(#goldGrad)"/>
  <polygon points="18,64 20,66 22,64 20,62" fill="url(#goldGrad)"/>
  <polygon points="106,64 108,66 110,64 108,62" fill="url(#goldGrad)"/>

  <!-- Monogram A & B -->
  <text x="44" y="70" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="28" font-weight="300" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">A</text>
  <text x="64" y="66" font-family="'Alex Brush', 'Brush Script MT', 'Great Vibes', cursive, Georgia, serif" font-size="20" font-style="italic" fill="#FFF2D6" text-anchor="middle">&amp;</text>
  <text x="84" y="70" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="28" font-weight="300" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">B</text>

  <!-- Wedding Year 2027 -->
  <text x="64" y="85" font-family="'Montserrat', -apple-system, sans-serif" font-size="8.5" font-weight="600" letter-spacing="3" fill="url(#goldGrad)" opacity="0.9" text-anchor="middle">2027</text>
</svg>